services:
  - type: web
    name: 11_5Class_Direction
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GITHUB_OWNER
        value: TheIulius
      - key: GITHUB_REPO
        value: 11_5Class_Direction
      - key: GITHUB_BRANCH
        value: data
