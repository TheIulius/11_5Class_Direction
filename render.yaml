services:
  - type: web
    name: komarovi-charity-league
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GITHUB_OWNER
        value: TheIulius
      - key: GITHUB_REPO
        value: premier-league-fantasy
      - key: GITHUB_BRANCH
        value: data
