<!doctype html>
<html lang="ka" data-design-preview="notebook" data-notebook-accent="purple">
  <head>
    <link rel="icon" type="image/svg+xml" href="/direction-icon.svg" />
    <link rel="apple-touch-icon" href="/direction-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#fdfbf7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>11/5 კლასი • კომაროვის პლატფორმა</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kalam:wght@300;400;700&family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('class11_5_notebook_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'light';
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            if (metaTheme) metaTheme.setAttribute('content', '#131722');
          } else {
            document.documentElement.classList.remove('dark');
            if (metaTheme) metaTheme.setAttribute('content', '#fdfbf7');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-page)] text-[var(--text-primary)] selection:bg-[var(--primary-action)] selection:text-white antialiased overflow-x-clip font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
