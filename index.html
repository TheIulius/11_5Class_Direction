<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/kcl-badge.png" />
    <link rel="apple-touch-icon" href="/kcl-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>11/5 Direction | 11th Grade Presidential Campaign Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('fpl_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            if (metaTheme) metaTheme.setAttribute('content', '#090d16');
          } else {
            document.documentElement.classList.remove('dark');
            if (metaTheme) metaTheme.setAttribute('content', '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#090d16] dark:text-slate-100 selection:bg-emerald-500 selection:text-white antialiased overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
